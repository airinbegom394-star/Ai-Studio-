<script>
  async function askAI() {
    const question = document.getElementById('userQuestion').value;
    const outputDiv = document.getElementById('aiOutput');
    
    if (!question) {
      outputDiv.innerText = "দয়া করে একটি প্রশ্ন লিখুন।";
      return;
    }

    outputDiv.innerText = "এআই উত্তর খুঁজছে, একটু অপেক্ষা করুন...";

    const apiKey = "আপনার_গেমিনি_এপিআই_কি_এখানে_দিন"; // এখানে আপনার ফ্রি Gemini API Key বসাবেন
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    try {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: question }] }]
        })
      });

      const data = await response.json();
      const aiReply = data.candidates[0].content.parts[0].text;
      outputDiv.innerText = aiReply;
    } catch (error) {
      outputDiv.innerText = "দুঃখিত, উত্তর আনতে সমস্যা হয়েছে। আবার চেষ্টা করুন।";
    }
  }
</script>
