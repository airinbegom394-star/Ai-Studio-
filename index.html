<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Universe</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .box { max-width: 400px; margin: 30px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #4F46E5; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        textarea { width: 100%; height: 90px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; resize: none; }
        button { width: 100%; background-color: #4F46E5; color: white; border: none; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: #4338ca; }
        #result { margin-top: 15px; padding: 12px; background: #eef2ff; border-radius: 8px; text-align: left; font-size: 14px; line-height: 1.5; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h1>Ai Universe 🎓</h1>
        <p>আপনার পড়ার যেকোনো প্রশ্ন নিচে লিখুন:</p>
        
        <textarea id="question" placeholder="যেমন: আলোর প্রতিফলন বলতে কী বোঝায়?"></textarea>
        <button onclick="getAnswer()" id="btn">উত্তর দাও</button>

        <div id="result"></div>
    </div>

    <script>
        async function getAnswer() {
            var q = document.getElementById("question").value;
            var res = document.getElementById("result");
            var btn = document.getElementById("btn");

            if (q.trim() === "") {
                alert("অনুগ্রহ করে একটি প্রশ্ন লিখুন!");
                return;
            }

            res.style.display = "block";
            res.innerHTML = "<b>Ai Universe:</b> উত্তর তৈরি হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...";
            btn.disabled = true;

            try {
                let response = await fetch("https://text.pollinations.ai/" + encodeURIComponent("You are an educational assistant for Bangladeshi school students. Answer in simple Bengali. Question: " + q));
                let data = await response.text();

                res.innerHTML = "<b>Ai Universe:</b><br>" + data;
            } catch (error) {
                res.innerHTML = "<b>Ai Universe:</b> দুঃখিত, উত্তর পেতে সমস্যা হয়েছে। আবার চেষ্টা করুন।";
            } finally {
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
