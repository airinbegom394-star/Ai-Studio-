<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schoolify AI</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
    .box { max-width: 400px; margin: 30px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { color: #4F46E5; margin-bottom: 5px; }
    p { color: #666; font-size: 14px; }
    textarea { width: 100%; height: 90px; margin-top: 15px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; }
    button { width: 100%; background-color: #4F46E5; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; margin-top: 10px; cursor: pointer; }
    #result { margin-top: 15px; padding: 10px; background: #eef2ff; border-radius: 8px; font-size: 14px; text-align: left; }
  </style>
</head>
<body>

<div class="box">
  <h1>Ai Studio 🎓</h1>
  <p>আপনার পড়ার যেকোনো প্রশ্ন নিচে লিখুন:</p>
  
  <textarea id="question" placeholder="যেমন: আলোর প্রতিফলন বলতে কী বোঝায়?"></textarea>
  <button onclick="getAnswer()">উত্তর দাও</button>

  <div id="result">আপনার উত্তর এখানে দেখাবে...</div>
</div>

<script>
  function getAnswer() {
    var q = document.getElementById("question").value;
    var res = document.getElementById("result");
    if(q.trim() === "") {
      res.innerHTML = "পড়াশোনার কোনো প্রশ্ন লিখুন!";
    } else {
      res.innerHTML = "<b>প্রশ্ন:</b> " + q + "<br><br><b>Schoolify AI:</b> আপনার ওয়েবসাইটটি এখন সফলভাবে চালু হয়েছে!";
    }
  }
</script>

</body>
</html>
